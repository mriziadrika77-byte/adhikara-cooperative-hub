# Netlify Configuration for ADHIKARA Frontend Application
# Framework: React 19 + Vite 8 (SPA)

[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) redirect fallback
# Memastikan semua rute URL langsung diarahkan ke index.html tanpa error 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Pengaturan header keamanan & performa statis
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
